# Tokenometer release pipeline.
#
# One trigger, every artifact:
#   1. Changesets opens / merges a "Version Packages" PR. Merging it lands here.
#   2. The `release` job publishes `tokenometer`, `@tokenometer/core`, and
#      `@tokenometer/mcp` to npm with provenance using direct `npm publish` (the
#      Changesets action's bundled publish path 404'd against this org's
#      auth — see commit history). It then creates a GitHub Release on the
#      new tag. The GitHub Marketplace re-publishes the Action listing
#      automatically when the Release is created from a tag.
#   3. The same job then publishes the VS Code extension to the VS Code
#      Marketplace via `vsce` and to Open VSX via `ovsx` (Cursor / Codium).
#   4. Marketplace listing is HTTP-verified (best-effort — propagation can lag).
#   5. The Vercel deploy hook is fired so the playground rebuilds against the
#      new published packages.
#   6. A separate `smoke-test` job runs on a fresh runner against the
#      just-published versions on npm.
#
# npm publishing auth:
#   Uses npm Trusted Publishing (OIDC), not long-lived tokens. Configure npm
#   trusted publishers for `tokenometer`, `@tokenometer/core`, and
#   `@tokenometer/mcp` with:
#     owner/repo: faraa2m/tokenometer
#     workflow: release.yml
#   Keep `permissions.id-token: write` below; npm exchanges the GitHub OIDC
#   token for a short-lived publish credential at `npm publish` time.
#
# Required GitHub repository secrets:
#   VSCE_PAT            — Personal Access Token from https://dev.azure.com.
#                         Scope: Marketplace → Manage. Skipped if absent.
#   OVSX_PAT            — Personal Access Token from https://open-vsx.org.
#                         Skipped if absent (Cursor / VSCodium read here).
#   VERCEL_DEPLOY_HOOK  — Vercel deploy hook URL. Optional (auto-rebuild
#                         on push covers it).

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (skip npm publish, skip GitHub Release, skip Marketplace publishes, skip Vercel hook).'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Changesets ONLY handles versioning + the "Version Packages" PR.
      # Publishing is done directly with `npm publish` below — the
      # Changesets action's own publish path returned E404 on this org's
      # auth chain even with a verified-good token (token works locally,
      # fails inside the action). Direct publish is what worked since
      # the initial rollout.
      - name: Changesets — open / update Version Packages PR
        if: ${{ inputs.dry-run != 'true' }}
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          # publish: intentionally omitted; we do it explicitly below.
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: false  # we create it after publish succeeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Detect whether the current commit on main has unpublished package
      # versions. If so, the Version Packages PR was just merged and we
      # need to publish.
      - name: Detect unpublished versions
        id: detect
        if: ${{ inputs.dry-run != 'true' && steps.changesets.outputs.hasChangesets != 'true' }}
        run: |
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          MCP_VERSION=$(node -p "require('./packages/mcp/package.json').version")
          echo "core_version=$CORE_VERSION" >> $GITHUB_OUTPUT
          echo "cli_version=$CLI_VERSION" >> $GITHUB_OUTPUT
          echo "mcp_version=$MCP_VERSION" >> $GITHUB_OUTPUT

          NEEDS_PUBLISH=false
          if ! npm view "@tokenometer/core@$CORE_VERSION" version >/dev/null 2>&1; then
            echo "@tokenometer/core@$CORE_VERSION not on npm — will publish"
            NEEDS_PUBLISH=true
          else
            echo "@tokenometer/core@$CORE_VERSION already on npm — skip"
          fi
          if ! npm view "tokenometer@$CLI_VERSION" version >/dev/null 2>&1; then
            echo "tokenometer@$CLI_VERSION not on npm — will publish"
            NEEDS_PUBLISH=true
          else
            echo "tokenometer@$CLI_VERSION already on npm — skip"
          fi
          if ! npm view "@tokenometer/mcp@$MCP_VERSION" version >/dev/null 2>&1; then
            echo "@tokenometer/mcp@$MCP_VERSION not on npm — will publish"
            NEEDS_PUBLISH=true
          else
            echo "@tokenometer/mcp@$MCP_VERSION already on npm — skip"
          fi
          echo "needs_publish=$NEEDS_PUBLISH" >> $GITHUB_OUTPUT

      - name: Publish @tokenometer/core
        id: publish_core
        if: ${{ steps.detect.outputs.needs_publish == 'true' }}
        working-directory: packages/core
        continue-on-error: true
        run: npm publish --provenance --access public

      - name: Publish tokenometer (CLI)
        id: publish_cli
        if: ${{ steps.detect.outputs.needs_publish == 'true' }}
        working-directory: packages/cli
        continue-on-error: true
        run: npm publish --provenance --access public

      - name: Publish @tokenometer/mcp
        id: publish_mcp
        if: ${{ steps.detect.outputs.needs_publish == 'true' }}
        working-directory: packages/mcp
        continue-on-error: true
        run: npm publish --provenance --access public

      # Set `published` based on step outcomes, NOT registry re-check.
      # npm registry has propagation lag (1-30s), so re-querying right after
      # a successful publish would intermittently return "not found" and
      # cause the gate to fail even when packages went up cleanly. Two cases:
      #   - needs_publish == 'false' → packages already on npm → published=true
      #     (idempotent re-runs, e.g. after a partial Phase I rerun)
      #   - both publish steps succeeded → published=true
      # Anything else → published=false; downstream steps skip.
      - name: Set publish status
        id: publish
        if: ${{ inputs.dry-run != 'true' && steps.changesets.outputs.hasChangesets != 'true' }}
        run: |
          CLI_VERSION="${{ steps.detect.outputs.cli_version }}"
          NEEDS_PUBLISH="${{ steps.detect.outputs.needs_publish }}"
          CORE_OUTCOME="${{ steps.publish_core.outcome }}"
          CLI_OUTCOME="${{ steps.publish_cli.outcome }}"
          MCP_OUTCOME="${{ steps.publish_mcp.outcome }}"

          if [ "$NEEDS_PUBLISH" = "false" ]; then
            PUBLISHED=true
            echo "All packages already on npm → published=true (idempotent path)"
          elif [ "$CORE_OUTCOME" = "success" ] && [ "$CLI_OUTCOME" = "success" ] && [ "$MCP_OUTCOME" = "success" ]; then
            PUBLISHED=true
            echo "All publish steps succeeded → published=true"
          else
            PUBLISHED=false
            echo "Publish gate failed: needs_publish=$NEEDS_PUBLISH core=$CORE_OUTCOME cli=$CLI_OUTCOME mcp=$MCP_OUTCOME"
          fi

          echo "published=$PUBLISHED" >> $GITHUB_OUTPUT
          echo "version=$CLI_VERSION" >> $GITHUB_OUTPUT

      # Create GitHub Release on the new tag. Marketplace re-publishes the
      # Action listing automatically when a Release is created from a tag.
      - name: Create GitHub Release
        if: ${{ steps.publish.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.publish.outputs.version }}"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — skipping"
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --generate-notes \
              --target main
            echo "Created release v$VERSION"
          fi

      # ── Phase I: VS Code Marketplace + Open VSX ─────────────────────────────
      - name: Build VS Code extension .vsix
        if: ${{ steps.publish.outputs.published == 'true' }}
        run: npm run package:vsix --workspace=packages/vscode

      - name: Locate built .vsix
        if: ${{ steps.publish.outputs.published == 'true' }}
        id: vsix
        run: |
          VSIX_PATH=$(ls packages/vscode/*.vsix | head -1)
          echo "path=$VSIX_PATH" >> $GITHUB_OUTPUT
          echo "Built: $VSIX_PATH"

      - name: Publish VS Code extension to Marketplace
        if: ${{ steps.publish.outputs.published == 'true' && env.VSCE_PAT != '' }}
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set +e
          OUT=$(npx --yes @vscode/vsce publish --packagePath "${{ steps.vsix.outputs.path }}" --pat "$VSCE_PAT" 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -eq 0 ]; then
            exit 0
          fi
          if echo "$OUT" | grep -qiE "already exists|already published"; then
            echo "ℹ Already published at this version — treating as success." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          exit $CODE

      - name: Notice — VS Code Marketplace skipped
        if: ${{ steps.publish.outputs.published == 'true' && env.VSCE_PAT == '' }}
        run: echo "VSCE_PAT not set, skipping VS Code Marketplace publish." >> $GITHUB_STEP_SUMMARY
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: ${{ steps.publish.outputs.published == 'true' && env.OVSX_PAT != '' }}
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set +e
          OUT=$(npx --yes ovsx publish "${{ steps.vsix.outputs.path }}" --pat "$OVSX_PAT" 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -eq 0 ]; then
            exit 0
          fi
          if echo "$OUT" | grep -qiE "already exists|already published|version.*exists"; then
            echo "ℹ Already published at this version — treating as success." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          exit $CODE

      - name: Notice — Open VSX skipped
        if: ${{ steps.publish.outputs.published == 'true' && env.OVSX_PAT == '' }}
        run: echo "OVSX_PAT not set, skipping Open VSX publish." >> $GITHUB_STEP_SUMMARY
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      # ── Phase I: GitHub Marketplace verify ──────────────────────────────────
      - name: Verify GitHub Marketplace listing
        if: ${{ steps.publish.outputs.published == 'true' }}
        run: |
          sleep 30
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://github.com/marketplace/actions/tokenometer)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Marketplace listing reachable (HTTP $HTTP_CODE)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠ Marketplace listing returned HTTP $HTTP_CODE — may still be propagating" >> $GITHUB_STEP_SUMMARY
          fi

      # ── Phase I: Vercel deploy hook ─────────────────────────────────────────
      - name: Trigger Vercel deploy
        if: ${{ steps.publish.outputs.published == 'true' && env.VERCEL_DEPLOY_HOOK != '' }}
        run: curl -fsSL -X POST "$VERCEL_DEPLOY_HOOK"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

      - name: Notice — Vercel deploy hook skipped
        if: ${{ steps.publish.outputs.published == 'true' && env.VERCEL_DEPLOY_HOOK == '' }}
        run: echo "VERCEL_DEPLOY_HOOK not set, skipping explicit Vercel trigger (Vercel still auto-rebuilds on push to main)." >> $GITHUB_STEP_SUMMARY
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

      - name: Summary
        if: ${{ steps.publish.outputs.published == 'true' }}
        run: |
          VERSION="${{ steps.publish.outputs.version }}"
          {
            echo "### Published"
            echo "- npm: tokenometer@${VERSION} — https://www.npmjs.com/package/tokenometer"
            echo "- npm: @tokenometer/core@${VERSION} — https://www.npmjs.com/package/@tokenometer/core"
            echo "- GitHub Release: v${VERSION} — https://github.com/faraa2m/tokenometer/releases/tag/v${VERSION}"
            echo "- GitHub Marketplace: https://github.com/marketplace/actions/tokenometer"
            echo "- VS Code Marketplace: https://marketplace.visualstudio.com/items?itemName=faraa2m.tokenometer"
            echo "- Open VSX: https://open-vsx.org/extension/faraa2m/tokenometer"
            echo "- Playground deploy: https://tokenometer.vercel.app"
          } >> $GITHUB_STEP_SUMMARY

      - name: Dry run notice
        if: ${{ inputs.dry-run == 'true' }}
        run: |
          echo "### Dry run" >> $GITHUB_STEP_SUMMARY
          echo "Skipped publish + Phase I steps." >> $GITHUB_STEP_SUMMARY

  smoke-test:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: Smoke test published CLI
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          echo "Smoke-testing tokenometer@$VERSION"
          # Wait for npm registry to propagate the new version (some CDN edges
          # take 30-60s after a successful publish). Retry the install for up
          # to 3 minutes before giving up.
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          for i in 1 2 3 4 5 6; do
            if npm install --no-save "tokenometer@$VERSION" >/dev/null 2>&1; then
              echo "  installed on attempt $i"
              break
            fi
            echo "  attempt $i: waiting 30s for registry propagation..."
            sleep 30
          done
          # Direct node invocation — bypasses npx bin-resolution differences
          # across runners and works regardless of whether the .bin symlink
          # got the executable bit honored on this filesystem.
          ENTRY="node_modules/tokenometer/dist/index.js"
          test -f "$ENTRY" || { echo "ERROR: $ENTRY missing after install"; ls -la node_modules/tokenometer/dist/ || true; exit 1; }
          node "$ENTRY" --version
          echo "test prompt" > smoke.md
          node "$ENTRY" smoke.md --model claude-opus-4-7 --output sarif | jq -e '.version == "2.1.0"' >/dev/null
          echo "✓ tokenometer@$VERSION CLI smoke passed" >> $GITHUB_STEP_SUMMARY
